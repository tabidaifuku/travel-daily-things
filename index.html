<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅遊大小事</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f7f3ec;
      --paper: #fffdf8;
      --ink: #26302f;
      --muted: #6d7470;
      --line: #d8d0c2;
      --green: #0f766e;
      --green-dark: #0d5f59;
      --blue: #376b9c;
      --warm: #b66b2a;
      --soft: #eef7f5;
      --shadow: 0 18px 52px rgba(38, 31, 22, .12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #fdfbf6 0%, var(--bg) 54%, #edf4f1 100%);
      font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif;
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; border-radius: 6px; min-height: 42px; padding: 0 16px; font-weight: 700; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 11px; background: #fffefa; color: var(--ink); }
    textarea { min-height: 118px; resize: vertical; line-height: 1.65; }
    label { display: block; margin-bottom: 6px; color: #46514e; font-size: 13px; font-weight: 700; }
    h1, h2, h3, p { margin-top: 0; }

    .wrap { width: min(1120px, calc(100% - 30px)); margin: 0 auto; padding: 26px 0 44px; }
    .hero { min-height: 76vh; display: grid; grid-template-columns: .95fr 1.05fr; gap: 28px; align-items: center; }
    .eyebrow { color: var(--warm); font-weight: 800; letter-spacing: 0; margin-bottom: 12px; }
    h1 { font-size: clamp(38px, 7vw, 76px); line-height: 1; margin-bottom: 18px; letter-spacing: 0; }
    h1 .headline-line { display: block; white-space: nowrap; }
    .lead { color: var(--muted); line-height: 1.9; font-size: 18px; max-width: 680px; }
    .primary { background: var(--green); color: white; box-shadow: 0 12px 24px rgba(15, 118, 110, .23); }
    .secondary { background: #eee9df; color: #313c39; border: 1px solid var(--line); }
    .ghost { background: transparent; border: 1px solid #bdd8d4; color: var(--green-dark); }

    .photo {
      aspect-ratio: 4 / 3;
      min-height: 0;
      width: min(100%, 620px);
      justify-self: end;
      border-radius: 8px;
      background:
        linear-gradient(160deg, rgba(255, 253, 248, .12), rgba(247, 243, 236, .08)),
        url("assets/travel-doodle-hero-4x3-v2.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, .68);
    }

    .section-head { display: flex; justify-content: space-between; gap: 18px; align-items: end; margin: 26px 0 14px; }
    .section-head h2 { font-size: clamp(26px, 4vw, 40px); margin-bottom: 6px; }
    .muted { color: var(--muted); line-height: 1.7; }

    .tour-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .tour-card, .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 12px 34px rgba(38, 31, 22, .08);
    }
    .tour-card { overflow: hidden; display: grid; min-width: 0; }
    .tour-image { aspect-ratio: 21 / 8; min-height: 148px; background-size: cover; background-position: center; }
    .tour-body { padding: 14px 16px 16px; display: grid; gap: 10px; min-width: 0; }
    .tour-body > * { min-width: 0; }
    .tour-body .primary { justify-self: start; min-width: 104px; max-width: 100%; min-height: 40px; padding: 0 16px; white-space: nowrap; }
    .tour-title { font-size: 20px; font-weight: 900; margin: 0; overflow-wrap: anywhere; word-break: break-word; }
    .tour-subtitle {
      margin: 0;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      white-space: normal;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .tour-body p, .tour-body div, .tour-body span, .tour-body strong { overflow-wrap: anywhere; word-break: break-word; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { display: inline-flex; align-items: center; min-height: 26px; padding: 0 9px; border-radius: 999px; background: var(--soft); color: var(--green-dark); font-size: 13px; font-weight: 700; }
    .price { font-size: 22px; font-weight: 900; color: var(--blue); overflow-wrap: anywhere; word-break: break-word; }
    .card-actions { display: grid; grid-template-columns: 1fr; gap: 8px; align-items: start; }
    .small { font-size: 12px; color: var(--muted); line-height: 1.6; }

    .panel { padding: 18px; }
    .days { display: grid; gap: 24px; }
    .day { border-bottom: 1px solid #e4ded2; padding: 0 0 22px; line-height: 1.75; }
    .day:last-child { border-bottom: 0; }
    .day-content { min-width: 0; }
    .day-title { display: block; margin-bottom: 12px; font-size: 18px; font-weight: 900; color: #173e52; }
    .day-title span { color: var(--green-dark); margin-right: 6px; }
    .day-collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .day-photo { border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--line); min-height: 0; }
    .day-photo { aspect-ratio: 4 / 3; }
    .day-summary { background: #f8f5ed; border-radius: 6px; padding: 12px; color: #3d4744; }
    .meal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; font-size: 15px; line-height: 1.55; }
    .meal-chip { border: 1px solid var(--line); border-radius: 6px; background: #fffefa; padding: 9px 10px; font-weight: 700; }
    .meal-chip:nth-child(4) { grid-column: 1 / -1; }
    .detail-toggle { display: flex; justify-content: flex-end; margin-top: 8px; }
    .detail-toggle button { min-height: 34px; padding: 0 4px; background: transparent; color: var(--green); font-size: 13px; box-shadow: none; }
    .day-detail { display: none; margin-top: 10px; border-left: 3px solid var(--green); background: #fffefa; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    .day-detail.open { display: block; }
    .field { margin-bottom: 12px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .notice { border: 1px solid #e6cf9b; background: #fff8e8; border-radius: 8px; padding: 14px; line-height: 1.75; color: #65420a; white-space: pre-wrap; }
    .notice h3 { margin: 0 0 8px; color: #6b4308; font-size: 18px; }
    .message { min-height: 22px; color: var(--green-dark); font-weight: 700; }
    .modal-bg { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(23, 31, 30, .46); }
    .modal-bg.open { display: flex; }
    .modal { width: min(980px, 100%); max-height: 92vh; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 24px 70px rgba(23, 31, 30, .28); }
    .modal-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 14px; align-items: start; padding: 16px 18px; background: #faf7ef; border-bottom: 1px solid var(--line); }
    .modal-title-block { min-width: 0; }
    .modal-title-block h2 { overflow-wrap: anywhere; word-break: break-word; }
    .modal-head button { flex: 0 0 auto; white-space: nowrap; min-width: 58px; padding: 0 12px; }
    .modal-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .modal-body { padding: 18px; display: grid; gap: 16px; align-items: start; }
    .tour-hero-photo { width: 100%; aspect-ratio: 21 / 8; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--line); margin-bottom: 14px; }
    .print-image { display: none; }
    .info-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
    .info-item { background: #f8f5ed; border: 1px solid #e7decd; border-radius: 6px; padding: 10px; }
    .info-item span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .flight-box { border: 1px solid #cde4e0; background: #fbfdfa; border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
    .flight-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid #d7e7e4; }
    .flight-head h3 { margin: 0; font-size: 20px; color: #173e52; }
    .flight-note { color: var(--warm); font-size: 13px; font-weight: 700; }
    .flight-table { padding: 12px; }
    .flight-row { display: grid; grid-template-columns: 86px 1.1fr 1fr 1fr 54px 1fr; gap: 10px; align-items: center; background: #f5faf8; border-bottom: 1px solid #d7e7e4; padding: 12px; line-height: 1.55; }
    .flight-row:first-child { border-radius: 8px 8px 0 0; }
    .flight-row:last-child { border-bottom: 0; border-radius: 0 0 8px 8px; }
    .flight-type { display: grid; place-items: center; align-self: stretch; background: #e8f3f1; color: var(--green-dark); font-weight: 900; border-radius: 6px; }
    .flight-airline strong { display: block; color: #173e52; }
    .flight-airline span, .flight-date, .flight-place { color: var(--muted); }
    .flight-time { font-size: 20px; font-weight: 900; color: var(--ink); }
    .flight-arrow { height: 1px; background: #aebdb9; position: relative; }
    .flight-arrow::after { content: ""; position: absolute; right: -1px; top: -4px; border-left: 9px solid #aebdb9; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
    .highlights { display: grid; gap: 8px; margin-bottom: 14px; }
    .highlight { background: var(--soft); border: 1px solid #cde4e0; border-radius: 6px; padding: 10px; line-height: 1.65; color: var(--green-dark); font-weight: 700; }
    .lead-panel { max-width: 680px; margin: 18px auto 0; }

    .site-footer { margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7; }
    .hidden { display: none !important; }

    @media (max-width: 920px) {
      .hero, .info-strip { grid-template-columns: 1fr; }
      .photo { width: min(100%, 620px); justify-self: center; }
      .tour-hero-photo { aspect-ratio: 21 / 8; }
      .day-collage { grid-template-columns: 1fr 1fr; }
      .meal-grid { grid-template-columns: repeat(2, 1fr); }
      .meal-chip:nth-child(4) { grid-column: 1 / -1; }
      .flight-row { grid-template-columns: 1fr; }
      .flight-type { place-items: start; padding: 7px 9px; }
      .flight-arrow { display: none; }
    }

    @media (max-width: 560px) {
      .wrap { width: min(100% - 20px, 1120px); padding-top: 18px; }
      .two, .section-head { display: grid; grid-template-columns: 1fr; }
      h1 { font-size: clamp(42px, 13vw, 54px); line-height: 1.08; }
      .hero { min-height: auto; padding-bottom: 12px; }
      .photo { aspect-ratio: 4 / 3; min-height: 0; width: 100%; max-width: 420px; justify-self: center; background-position: center center; }
      .tour-grid { grid-template-columns: 1fr; }
      .day-collage { grid-template-columns: 1fr; }
      .meal-grid { grid-template-columns: 1fr; }
      .tour-body .primary { justify-self: stretch; width: 100%; }
      .modal-tools { justify-content: flex-start; }
    }

    @page { size: A4; margin: 8mm; }

    @media print {
      html, body { width: 100%; }
      body { background: #fff; font-size: 15.5px; }
      main { display: none; }
      .modal-bg.open { position: static; display: block; padding: 0; background: #fff; }
      .modal { width: 100%; max-width: none; max-height: none; overflow: visible; border: 0; box-shadow: none; }
      .modal-head { position: static; padding: 0 0 14px; background: #fff; border-bottom: 0; }
      .modal-title-block h2, #modalTitle { font-size: 28px; line-height: 1.25; margin-bottom: 6px; }
      #modalSubtitle { font-size: 16px; line-height: 1.5; }
      .modal-tools, .lead-panel { display: none !important; }
      .modal-body { padding: 0; display: block; }
      .detail-toggle { display: none !important; }
      .day-detail { display: block !important; }
      .tour-hero-photo { aspect-ratio: 21 / 8; max-height: none; border: 0; border-radius: 0; }
      .info-strip { grid-template-columns: repeat(3, 1fr); font-size: 15px; }
      .days { gap: 16px; }
      .day { break-inside: auto; page-break-inside: auto; padding-bottom: 14px; line-height: 1.75; }
      .day-title { break-after: avoid; page-break-after: avoid; margin-bottom: 11px; font-size: 19px; }
      .day-collage { break-inside: avoid; page-break-inside: avoid; width: 100%; grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 8px; margin-bottom: 12px; }
      .day-photo { width: 100%; aspect-ratio: 4 / 3; max-height: none; }
      .tour-hero-photo, .day-photo { background-image: none !important; height: auto; overflow: hidden; }
      .print-image { display: block; width: 100%; height: 100%; object-fit: cover; }
      .tour-hero-photo .print-image { aspect-ratio: 21 / 8; }
      .day-photo .print-image { aspect-ratio: 4 / 3; }
      .day-detail { margin-top: 9px; padding: 12px 14px; font-size: 16px; line-height: 1.75; }
      .day-summary { padding: 11px; }
      .meal-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 8px; font-size: 15px; line-height: 1.55; }
      .meal-chip, .meal-chip:nth-child(4) { grid-column: auto !important; padding: 9px; }
      .flight-box { margin-bottom: 12px; border-radius: 0; break-inside: auto; page-break-inside: auto; }
      .flight-head { break-after: avoid; page-break-after: avoid; }
      .flight-head { padding: 11px 12px; }
      .flight-head h3 { font-size: 19px; }
      .flight-note { font-size: 13px; }
      .flight-table { padding: 0; }
      .flight-row { break-inside: avoid; page-break-inside: avoid; grid-template-columns: 58px 1.05fr .9fr .9fr 24px .9fr !important; gap: 7px; padding: 10px; font-size: 13.5px; line-height: 1.4; }
      .flight-type { place-items: center !important; padding: 5px; }
      .flight-arrow { display: block !important; }
      .flight-time { font-size: 15px; }
      .tour-hero-photo, .day-photo { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div>
        <p class="eyebrow">旅遊大小事</p>
        <h1><span class="headline-line">日本旅行，</span><span class="headline-line">從一個想法開始。</span></h1>
        <p class="lead">訂房、訂車、訂餐、 and anything... 問我。</p>
      </div>
      <div class="photo" aria-label="蠟筆塗鴉風旅行小物插圖"></div>
    </section>

    <section id="tours">
      <div class="section-head">
        <div class="modal-title-block">
          <h2>行程小本本</h2>
          <p class="muted">想去的地方，從這裡開始。</p>
        </div>
      </div>
      <div class="tour-grid" id="tourGrid">
      </div>
    </section>

    <footer class="site-footer">
      <div>旅遊大小事｜created in 2026</div>
      <div>managed by natuho</div>
    </footer>
  </main>

  <div class="modal-bg" id="tourModal" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head">
        <div>
          <h2 id="modalTitle">行程介紹</h2>
          <p class="muted" id="modalSubtitle"></p>
        </div>
        <div class="modal-tools">
          <button class="ghost" type="button" onclick="shareCurrentTour()">複製連結</button>
          <button class="ghost" type="button" onclick="printCurrentTour()">列印 PDF</button>
          <button class="secondary" type="button" onclick="closeTour()">關閉</button>
        </div>
      </div>
      <div class="modal-body">
        <article>
          <div class="tour-hero-photo" id="modalPhoto"></div>
          <div class="info-strip" id="modalInfo"></div>
          <div id="modalFlights"></div>
          <div class="highlights" id="modalHighlights"></div>
          <div class="days" id="modalDays"></div>
          <div class="notice" style="margin-top:14px" id="modalNotice"></div>
        </article>

        <form class="panel lead-panel" id="leadForm">
          <h2>我要詢問／報名</h2>
          <input id="tourName" type="hidden">
          <div class="two">
            <div class="field"><label for="name">姓名</label><input id="name" type="text" required></div>
            <div class="field"><label for="people">人數</label><input id="people" type="number" min="1" required></div>
          </div>
          <div class="field"><label for="phone">電話</label><input id="phone" type="tel" required></div>
          <div class="field"><label for="email">e-mail</label><input id="email" type="email"></div>
          <div class="field"><label for="memo">需求內容</label><textarea id="memo"></textarea></div>
          <button class="primary" type="submit">送出</button>
          <p class="message" id="formMessage"></p>
          <p class="small">送出後會由我們再聯繫確認；送出不代表預約完成或價格保證。</p>
        </form>
      </div>
    </section>
  </div>

  <script>
    const supabaseUrl = "https://awlrmtyynguetdsxswgc.supabase.co";
    const supabaseKey = "sb_publishable_-3c0c7c4grzS7_OaNfRALw_Xv31hjIT";
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    const $ = (id) => document.getElementById(id);
    const tours = {};
    const defaultTravelNotice = [
      "出發前先知道",
      "・行程內容、順序、航班時間、飯店、餐食與景點安排，會依出發日期、訂位狀況與當地實際情況調整，最終內容以確認資料為準。",
      "・如遇天候不佳、颱風、大雪、地震、火山活動、交通管制或其他不可抗力因素，將以安全與行程順暢為優先，必要時調整景點、交通或住宿安排。",
      "・部分景點、餐廳、交通或體驗活動，可能因營業時間、預約狀況、現場管制或季節因素而調整。",
      "・若有素食、食物過敏、行動不便、嬰幼兒同行、孕婦同行或其他特殊需求，請於報名前先告知，以便協助確認可安排內容。",
      "・飯店房型、床型、吸菸／禁菸、樓層、相鄰房或連通房等需求，將盡力協助安排，但仍以飯店最終回覆與現場安排為準。",
      "・日本飯店房型與空間依各飯店規定不同，三人房多為雙人房加床，加床後房內活動空間可能較有限，實際安排以飯店可提供房型為準。",
      "・報名前請確認護照效期、簽證規定、入境規範與個人健康狀況，並建議自行投保旅遊平安保險及旅遊不便險。",
      "・行程報價會依出發日、航班、飯店、房型、人數與匯率等條件調整，實際內容與費用以最終確認單為準。"
    ].join("\n");
    const sharedTourId = new URLSearchParams(location.search).get("tour");
    let currentTourName = "";
    let currentTour = null;
    let openedSharedTour = false;

    renderTourCards();
    loadPublishedTours();

    function renderTourCards() {
      if (!Object.keys(tours).length) {
        $("tourGrid").innerHTML = `<div class="panel"><p class="muted" style="margin:0">目前尚未上架行程，請稍後再看看。</p></div>`;
        return;
      }
      $("tourGrid").innerHTML = Object.entries(tours).map(([name, tour]) => `
        <article class="tour-card">
          ${tour.image ? `<div class="tour-image" style="${imageStyle(tour.image, tour.heroStyle)}"></div>` : ""}
          <div class="tour-body">
            <h3 class="tour-title">${name}</h3>
            <div class="tags"><span class="tag">行程小本本</span><span class="tag">${(tour.info?.[0]?.[1]) || "可詢問"}</span><span class="tag">可客製</span></div>
            <p class="muted tour-subtitle">${tour.subtitle || "喜歡這個行程可以先送出需求，後續會再聯繫確認。"}</p>
            <div class="card-actions">
              <div class="price">${tour.price || tour.info?.find(([label]) => label === "價格")?.[1] || "詢問後報價"}</div>
              <button class="primary" type="button" onclick="selectTour('${escapeJs(name)}')">我要詢問</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    async function loadPublishedTours() {
      const { data, error } = await client.from("site_tours").select("*").eq("is_published", true).order("sort_order", { ascending: true }).order("created_at", { ascending: false });
      if (error || !data || !data.length) return;
      Object.keys(tours).forEach((key) => delete tours[key]);
      data.forEach((row) => {
        const payload = row.payload || {};
        const title = payload.title || row.title;
        tours[title] = {
          ...payload,
          id: row.id,
          slug: row.slug,
          subtitle: payload.subtitle || row.subtitle,
          image: payload.image || row.hero_image,
          price: payload.price || row.price
        };
      });
      renderTourCards();
      openSharedTour();
    }

    function scrollToTours() {
      $("tours").scrollIntoView({ behavior: "smooth" });
    }

    function selectTour(name) {
      const fallbackName = Object.keys(tours)[0];
      if (!fallbackName) return;
      const selectedName = tours[name] ? name : fallbackName;
      const tour = tours[selectedName];
      currentTourName = selectedName;
      currentTour = tour;
      $("modalTitle").textContent = selectedName;
      $("modalSubtitle").textContent = tour.subtitle;
      $("tourName").value = selectedName;
      $("modalPhoto").classList.toggle("hidden", !tour.image);
      $("modalPhoto").style.cssText = imageStyle(tour.image, tour.heroStyle);
      $("modalPhoto").innerHTML = tour.image ? printImageHtml(tour.image, tour.heroStyle, selectedName) : "";
      $("modalInfo").innerHTML = (tour.info || []).map(([label, value]) => `<div class="info-item"><span>${label}</span><strong>${value}</strong></div>`).join("");
      $("modalFlights").innerHTML = renderFlights(tour.flights || []);
      $("modalHighlights").innerHTML = (tour.highlights || []).map((item) => `<div class="highlight">${item}</div>`).join("");
      $("modalDays").innerHTML = (tour.days || []).map((day, index) => renderDay(day, index)).join("");
      $("modalNotice").innerHTML = renderNotice(defaultTravelNotice);
      $("modalNotice").classList.remove("hidden");
      $("formMessage").textContent = "";
      $("tourModal").classList.add("open");
      $("tourModal").setAttribute("aria-hidden", "false");
      $("tourModal").scrollTop = 0;
      const modal = document.querySelector(".modal");
      if (modal) modal.scrollTop = 0;
    }

    function openSharedTour() {
      if (openedSharedTour || !sharedTourId || !Object.keys(tours).length) return;
      const match = Object.entries(tours).find(([name, tour]) => {
        return tour.id === sharedTourId || tour.slug === sharedTourId || name === sharedTourId;
      });
      if (!match) return;
      openedSharedTour = true;
      selectTour(match[0]);
    }

    async function shareCurrentTour() {
      if (!currentTourName || !currentTour) return;
      const id = currentTour.id || currentTour.slug || currentTourName;
      const url = `${location.origin}${location.pathname}?tour=${encodeURIComponent(id)}`;
      try {
        await navigator.clipboard.writeText(url);
        alert("行程連結已複製。");
      } catch (error) {
        prompt("請複製這個行程連結：", url);
      }
    }

    function printCurrentTour() {
      window.print();
    }

    function renderDay(day, index) {
      const title = day[0] || "";
      const body = day[1] || "";
      const dayImages = day[2] || [];
      const dayImageStyles = Array.isArray(day[3]) ? day[3] : [];
      const mealStart = body.indexOf("早餐：");
      const detail = mealStart >= 0 ? body.slice(0, mealStart).trim() : body.trim();
      const meals = mealStart >= 0 ? body.slice(mealStart).trim().split("\n").filter(Boolean) : [];
      const imageList = Array.isArray(dayImages) ? dayImages : dayImages ? [dayImages] : [];
      const collageImages = imageList.filter(Boolean).slice(0, 3);
      const routeTitle = title.replace(/^Day\s*\d+\s*/i, "");
      const detailId = `dayDetail${index}`;
      return `
        <div class="day">
          <div class="day-content">
            <div class="day-title"><span>第 ${index + 1} 天</span>${routeTitle}</div>
            ${collageImages.length ? `<div class="day-collage">
              ${collageImages.map((image, imageIndex) => `<div class="day-photo" style="${imageStyle(image, dayImageStyles[imageIndex])}">${printImageHtml(image, dayImageStyles[imageIndex], routeTitle)}</div>`).join("")}
            </div>` : ""}
            <div class="detail-toggle"><button type="button" onclick="toggleDayDetail('${detailId}', this)">展開行程內容⌄</button></div>
            <div class="day-detail" id="${detailId}">${detail}</div>
            <div class="day-summary">
              <div class="meal-grid">${meals.map((meal) => `<div class="meal-chip">${meal}</div>`).join("")}</div>
            </div>
          </div>
        </div>
      `;
    }

    function renderNotice(text) {
      const lines = String(text || "").split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      if (!lines.length) return "";
      const [title, ...items] = lines;
      return `<h3>${escapeText(title)}</h3>${items.map((line) => escapeText(line)).join("\n")}`;
    }

    function imageStyle(url, style = {}) {
      if (!url) return "";
      const x = Number(style.x ?? 50);
      const y = Number(style.y ?? 50);
      const zoom = Number(style.zoom ?? 100);
      const size = zoom === 100 ? "cover" : `${zoom}%`;
      return `background-image:url('${String(url || "").replaceAll("'", "\\'")}');background-position:${x}% ${y}%;background-size:${size};`;
    }

    function printImageHtml(url, style = {}, alt = "") {
      if (!url) return "";
      const x = Number(style.x ?? 50);
      const y = Number(style.y ?? 50);
      return `<img class="print-image" src="${escapeAttr(url)}" alt="${escapeAttr(alt || "行程圖片")}" style="object-position:${x}% ${y}%">`;
    }

    function escapeJs(value) {
      return String(value || "").replaceAll("\\", "\\\\").replaceAll("'", "\\'");
    }

    function escapeAttr(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll('"', "&quot;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function escapeText(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function toggleDayDetail(id, button) {
      const detail = $(id);
      const isOpen = detail.classList.toggle("open");
      button.textContent = isOpen ? "收合行程內容⌃" : "展開行程內容⌄";
    }

    function renderFlights(flights) {
      if (!flights.length) return "";
      return `
        <div class="flight-box">
          <div class="flight-head">
            <h3>參考航班</h3>
            <div class="flight-note">本行程航班以行程確認單為準</div>
          </div>
          <div class="flight-table">
          ${flights.map((flight) => `
            <div class="flight-row">
              <div class="flight-type">${flight.type}</div>
              <div class="flight-airline"><strong>${flight.airline}</strong><span>${flight.flightNo}</span></div>
              <div class="flight-date">${flight.date}</div>
              <div>
                <div class="flight-time">${flight.departTime}</div>
                <div class="flight-place">${flight.departPlace}</div>
              </div>
              <div class="flight-arrow" aria-hidden="true"></div>
              <div>
                <div class="flight-time">${flight.arriveTime}</div>
                <div class="flight-place">${flight.arrivePlace}</div>
              </div>
            </div>
          `).join("")}
          </div>
        </div>
      `;
    }

    function closeTour() {
      $("tourModal").classList.remove("open");
      $("tourModal").setAttribute("aria-hidden", "true");
    }

    $("tourModal").addEventListener("click", (event) => {
      if (event.target === $("tourModal")) closeTour();
    });

    $("leadForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      $("formMessage").textContent = "送出中...";
      const payload = {
        tour_name: $("tourName").value,
        customer_name: $("name").value.trim(),
        people_count: $("people").value ? Number($("people").value) : null,
        phone: $("phone").value.trim(),
        email: $("email").value.trim(),
        memo: $("memo").value.trim(),
        status: "新規詢問"
      };

      const { error } = await client.from("direct_inquiries").insert(payload);
      if (error) {
        console.error("direct_inquiries insert failed", error);
        $("formMessage").textContent = `目前送出失敗：${error.message || "請稍後再試，或直接聯繫我們。"}`;
        return;
      }

      notifyInquiryByEmail({ ...payload, created_at: new Date().toISOString() });
      $("leadForm").reset();
      $("tourName").value = payload.tour_name;
      $("formMessage").textContent = "已送出，後續會再與你聯繫。";
    });

    async function notifyInquiryByEmail(inquiry) {
      const { error } = await client.functions.invoke("send-inquiry-email", {
        body: { inquiry }
      });
      if (error) console.warn("詢問通知信寄送失敗，但詢問資料已儲存。", error);
    }
  </script>
</body>
</html>
