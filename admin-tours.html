<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅遊大小事｜詢問單後台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f7f3ec;
      --paper: #fffdf8;
      --ink: #26302f;
      --muted: #6d7470;
      --line: #d8d0c2;
      --green: #0f766e;
      --green-dark: #0d5f59;
      --blue: #376b9c;
      --warm: #b66b2a;
      --soft: #eef7f5;
      --danger: #9b3428;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: linear-gradient(180deg, #fdfbf6 0%, var(--bg) 58%, #edf4f1 100%); font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; border-radius: 6px; min-height: 40px; padding: 0 14px; font-weight: 800; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fffefa; color: var(--ink); }
    textarea { min-height: 96px; resize: vertical; line-height: 1.65; }
    label { display: block; margin-bottom: 6px; color: #46514e; font-size: 13px; font-weight: 800; }
    h1, h2, h3, p { margin-top: 0; }
    a { color: inherit; }
    .wrap { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; }
    .top h1 { margin-bottom: 4px; font-size: clamp(28px, 5vw, 46px); }
    .muted { color: var(--muted); line-height: 1.7; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: 0 12px 34px rgba(38, 31, 22, .08); margin-bottom: 14px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .primary { background: var(--green); color: white; box-shadow: 0 10px 20px rgba(15, 118, 110, .2); }
    .secondary { background: #eee9df; color: #313c39; border: 1px solid var(--line); }
    .ghost { background: transparent; color: var(--green-dark); border: 1px solid #bdd8d4; }
    .hidden { display: none !important; }
    .message { min-height: 24px; color: var(--green-dark); font-weight: 800; }
    .login-box { max-width: 460px; margin: 54px auto; }
    .field { margin-bottom: 12px; }
    .filter-row { display: grid; grid-template-columns: minmax(180px, 260px) auto 1fr; gap: 10px; align-items: end; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }
    .pill { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 10px; border-radius: 999px; background: #eef7f5; color: var(--green-dark); font-size: 13px; font-weight: 800; white-space: nowrap; }
    .list { display: grid; gap: 12px; }
    .card { border: 1px solid #d8d0c2; border-radius: 8px; background: #fffefa; padding: 16px; }
    .card-head { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: start; margin-bottom: 12px; }
    .card h2 { margin-bottom: 6px; font-size: 21px; color: #173e52; }
    .time { color: var(--muted); font-size: 13px; }
    .status-badge { border-radius: 999px; padding: 5px 10px; background: #f4efe5; color: #4c4238; font-size: 13px; font-weight: 900; white-space: nowrap; }
    .status-badge.new { background: #fff4df; color: #9a5a12; }
    .status-badge.active { background: #e9f4ff; color: var(--blue); }
    .status-badge.done { background: #e8f7ee; color: #1d6d41; }
    .status-badge.cancel { background: #f9e3df; color: var(--danger); }
    .info-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
    .info { border: 1px solid #e7decd; border-radius: 6px; background: #f8f5ed; padding: 10px; min-width: 0; }
    .info span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .info strong, .info a { overflow-wrap: anywhere; }
    .memo { white-space: pre-wrap; line-height: 1.7; border-left: 3px solid var(--green); background: #fffdf8; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; color: #37413f; }
    .edit-grid { display: grid; grid-template-columns: 220px 1fr auto; gap: 10px; align-items: end; }
    .empty { padding: 30px 12px; text-align: center; color: var(--muted); }

    @media (max-width: 820px) {
      .top, .filter-row, .card-head, .edit-grid { display: grid; grid-template-columns: 1fr; align-items: stretch; }
      .stats { justify-content: flex-start; }
      .info-grid { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 520px) {
      .info-grid { grid-template-columns: 1fr; }
      .toolbar a, .toolbar button { width: 100%; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div>
        <h1>詢問單後台</h1>
        <p class="muted">客人從前台送出的詢問會集中在這裡，方便追蹤聯絡狀態。</p>
      </div>
      <div class="toolbar">
        <a href="index.html"><button class="ghost" type="button">看前台</button></a>
        <a href="admin-tours.html"><button class="ghost" type="button">行程後台</button></a>
        <button class="secondary hidden" id="logoutBtn" type="button">登出</button>
      </div>
    </section>

    <section class="panel login-box" id="loginPanel">
      <h2>管理者登入</h2>
      <div class="field"><label for="loginEmail">e-mail</label><input id="loginEmail" type="email" autocomplete="username"></div>
      <div class="field"><label for="loginPassword">密碼</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
      <button class="primary" id="loginBtn" type="button">登入</button>
      <p class="message" id="loginMessage"></p>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="panel">
        <div class="filter-row">
          <div class="field">
            <label for="statusFilter">狀態篩選</label>
            <select id="statusFilter">
              <option value="">全部</option>
            </select>
          </div>
          <button class="ghost" type="button" id="reloadBtn">重新讀取</button>
          <div class="stats" id="statsArea"></div>
        </div>
        <p class="message" id="listMessage"></p>
      </div>
      <div class="list" id="inquiryList"></div>
    </section>
  </main>

  <script>
    const supabaseUrl = "https://awlrmtyynguetdsxswgc.supabase.co";
    const supabaseKey = "sb_publishable_-3c0c7c4grzS7_OaNfRALw_Xv31hjIT";
    const client = supabase.createClient(supabaseUrl, supabaseKey);
    const $ = (id) => document.getElementById(id);
    const statuses = ["新規詢問", "已聯絡", "報價中", "已成行", "已取消"];
    const idleLogoutMs = 10 * 60 * 1000;
    let idleLogoutTimer = null;
    let inquiries = [];

    $("loginBtn").addEventListener("click", login);
    $("loginPassword").addEventListener("keydown", (event) => { if (event.key === "Enter") login(); });
    $("logoutBtn").addEventListener("click", () => logout());
    $("reloadBtn").addEventListener("click", loadInquiries);
    $("statusFilter").addEventListener("change", renderInquiries);
    ["pointerdown", "keydown", "scroll", "touchstart"].forEach((eventName) => {
      window.addEventListener(eventName, resetIdleLogoutTimer, { passive: true });
    });

    init();

    async function init() {
      renderStatusFilter();
      const logoutMessage = sessionStorage.getItem("adminInquiryLogoutMessage");
      if (logoutMessage) {
        $("loginMessage").textContent = logoutMessage;
        sessionStorage.removeItem("adminInquiryLogoutMessage");
      }
      const { data } = await client.auth.getSession();
      if (data.session) showAdmin();
    }

    async function login() {
      $("loginMessage").textContent = "登入中...";
      const email = $("loginEmail").value.trim();
      const password = $("loginPassword").value;
      const { error } = await client.auth.signInWithPassword({ email, password });
      if (error) {
        $("loginMessage").textContent = "登入失敗，請確認 e-mail 和密碼。";
        return;
      }
      showAdmin();
    }

    async function showAdmin() {
      $("loginPanel").classList.add("hidden");
      $("adminPanel").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");
      resetIdleLogoutTimer();
      await loadInquiries();
    }

    async function logout(message = "") {
      clearTimeout(idleLogoutTimer);
      idleLogoutTimer = null;
      await client.auth.signOut();
      if (message) sessionStorage.setItem("adminInquiryLogoutMessage", message);
      location.reload();
    }

    function resetIdleLogoutTimer() {
      if ($("adminPanel").classList.contains("hidden")) return;
      clearTimeout(idleLogoutTimer);
      idleLogoutTimer = setTimeout(() => {
        logout("已閒置 10 分鐘，系統已自動登出。");
      }, idleLogoutMs);
    }

    function renderStatusFilter() {
      $("statusFilter").innerHTML = `<option value="">全部</option>` + statuses.map((status) => {
        return `<option value="${escapeAttr(status)}">${escapeText(status)}</option>`;
      }).join("");
    }

    async function loadInquiries() {
      $("listMessage").textContent = "讀取中...";
      const { data, error } = await client
        .from("direct_inquiries")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        $("listMessage").textContent = `讀取失敗：${error.message}`;
        inquiries = [];
        renderInquiries();
        return;
      }
      inquiries = data || [];
      $("listMessage").textContent = inquiries.length ? `已讀取 ${inquiries.length} 筆詢問。` : "目前沒有詢問單。";
      renderInquiries();
    }

    function renderInquiries() {
      const selectedStatus = $("statusFilter").value;
      const filtered = selectedStatus ? inquiries.filter((item) => (item.status || "新規詢問") === selectedStatus) : inquiries;
      renderStats();

      if (!filtered.length) {
        $("inquiryList").innerHTML = `<div class="panel empty">目前沒有符合條件的詢問單。</div>`;
        return;
      }

      $("inquiryList").innerHTML = filtered.map(renderInquiryCard).join("");
      filtered.forEach((item) => {
        const statusEl = $(`status-${item.id}`);
        const noteEl = $(`note-${item.id}`);
        const saveEl = $(`save-${item.id}`);
        saveEl.addEventListener("click", () => saveInquiry(item.id, statusEl.value, noteEl.value));
      });
    }

    function renderStats() {
      const counts = statuses.reduce((memo, status) => {
        memo[status] = inquiries.filter((item) => (item.status || "新規詢問") === status).length;
        return memo;
      }, {});
      $("statsArea").innerHTML = [
        `<span class="pill">全部 ${inquiries.length}</span>`,
        ...statuses.map((status) => `<span class="pill">${escapeText(status)} ${counts[status]}</span>`)
      ].join("");
    }

    function renderInquiryCard(item) {
      const status = item.status || "新規詢問";
      const note = item.internal_note || "";
      return `
        <article class="card">
          <div class="card-head">
            <div>
              <h2>${escapeText(item.tour_name || "直接詢問")}</h2>
              <div class="time">${formatDate(item.created_at)}</div>
            </div>
            <span class="status-badge ${statusClass(status)}">${escapeText(status)}</span>
          </div>
          <div class="info-grid">
            <div class="info"><span>姓名</span><strong>${escapeText(item.customer_name || "-")}</strong></div>
            <div class="info"><span>人數</span><strong>${escapeText(formatPeople(item.people_count))}</strong></div>
            <div class="info"><span>電話</span><strong>${phoneLink(item.phone)}</strong></div>
            <div class="info"><span>e-mail</span><strong>${emailLink(item.email)}</strong></div>
          </div>
          <div class="memo">${escapeText(item.memo || "沒有填寫需求內容。")}</div>
          <div class="edit-grid">
            <div class="field">
              <label for="status-${escapeAttr(item.id)}">處理狀態</label>
              <select id="status-${escapeAttr(item.id)}">${statusOptions(status)}</select>
            </div>
            <div class="field">
              <label for="note-${escapeAttr(item.id)}">內部備註</label>
              <textarea id="note-${escapeAttr(item.id)}" placeholder="例如：已回電、預計報價、偏好飯店等">${escapeText(note)}</textarea>
            </div>
            <button class="primary" type="button" id="save-${escapeAttr(item.id)}">儲存</button>
          </div>
        </article>
      `;
    }

    function statusOptions(currentStatus) {
      return statuses.map((status) => {
        const selected = status === currentStatus ? " selected" : "";
        return `<option value="${escapeAttr(status)}"${selected}>${escapeText(status)}</option>`;
      }).join("");
    }

    async function saveInquiry(id, status, internalNote) {
      const button = $(`save-${id}`);
      button.disabled = true;
      button.textContent = "儲存中";
      const { error } = await client
        .from("direct_inquiries")
        .update({ status, internal_note: internalNote, updated_at: new Date().toISOString() })
        .eq("id", id);

      if (error) {
        $("listMessage").textContent = `儲存失敗：${error.message}`;
        button.disabled = false;
        button.textContent = "儲存";
        return;
      }
      $("listMessage").textContent = "已儲存修改。";
      await loadInquiries();
    }

    function statusClass(status) {
      if (status === "新規詢問") return "new";
      if (status === "已聯絡" || status === "報價中") return "active";
      if (status === "已成行") return "done";
      if (status === "已取消") return "cancel";
      return "";
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return new Intl.DateTimeFormat("zh-TW", { dateStyle: "medium", timeStyle: "short" }).format(date);
    }

    function formatPeople(value) {
      if (value === null || value === undefined || value === "") return "-";
      return `${value} 人`;
    }

    function phoneLink(value) {
      if (!value) return "-";
      const safeValue = escapeText(value);
      return `<a href="tel:${escapeAttr(value)}">${safeValue}</a>`;
    }

    function emailLink(value) {
      if (!value) return "-";
      const safeValue = escapeText(value);
      return `<a href="mailto:${escapeAttr(value)}">${safeValue}</a>`;
    }

    function escapeText(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeAttr(value) {
      return escapeText(value);
    }
  </script>
</body>
</html>
