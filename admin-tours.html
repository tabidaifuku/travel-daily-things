<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅遊大小事｜行程後台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #f7f3ec;
      --paper: #fffdf8;
      --ink: #26302f;
      --muted: #6d7470;
      --line: #d8d0c2;
      --green: #0f766e;
      --green-dark: #0d5f59;
      --blue: #376b9c;
      --warm: #b66b2a;
      --soft: #eef7f5;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: linear-gradient(180deg, #fdfbf6 0%, var(--bg) 58%, #edf4f1 100%); font-family: "Microsoft JhengHei", "Noto Sans TC", system-ui, sans-serif; }
    button, input, textarea, select { font: inherit; }
    button { border: 0; cursor: pointer; border-radius: 6px; min-height: 40px; padding: 0 14px; font-weight: 800; }
    input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: #fffefa; color: var(--ink); }
    textarea { min-height: 130px; resize: vertical; line-height: 1.65; }
    label { display: block; margin-bottom: 6px; color: #46514e; font-size: 13px; font-weight: 800; }
    h1, h2, h3, p { margin-top: 0; }
    .wrap { width: min(1120px, calc(100% - 28px)); margin: 0 auto; padding: 24px 0 42px; }
    .top { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 18px; }
    .top h1 { margin-bottom: 4px; font-size: clamp(28px, 5vw, 46px); }
    .muted { color: var(--muted); line-height: 1.7; }
    .panel { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px; box-shadow: 0 12px 34px rgba(38, 31, 22, .08); margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .image-control-grid { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
    .field { margin-bottom: 12px; }
    .primary { background: var(--green); color: white; box-shadow: 0 10px 20px rgba(15, 118, 110, .2); }
    .secondary { background: #eee9df; color: #313c39; border: 1px solid var(--line); }
    .ghost { background: transparent; color: var(--green-dark); border: 1px solid #bdd8d4; }
    .danger { background: #f9e3df; color: #9b3428; border: 1px solid #efc4bd; }
    .hidden { display: none !important; }
    .message { min-height: 24px; color: var(--green-dark); font-weight: 800; }
    .day-card { border: 1px solid #c9d9d6; background: #fffefa; border-radius: 8px; padding: 14px; margin-bottom: 12px; }
    .day-head { display: flex; justify-content: space-between; gap: 10px; align-items: center; margin-bottom: 12px; }
    .day-head h3 { margin: 0; color: #173e52; }
    .image-controls { border: 1px solid #e5ded3; border-radius: 8px; padding: 10px; background: #fffefa; }
    .image-controls h4 { margin: 0 0 8px; color: #173e52; }
    .image-preview { border: 1px solid var(--line); border-radius: 8px; background: #eee9df; background-repeat: no-repeat; background-size: cover; background-position: center; margin-bottom: 10px; overflow: hidden; cursor: grab; touch-action: none; user-select: none; }
    .image-preview.empty { cursor: pointer; }
    .image-preview.dragging { cursor: grabbing; }
    .hero-preview { aspect-ratio: 21 / 8; max-height: 260px; }
    .day-preview { aspect-ratio: 4 / 3; }
    .image-preview.empty { display: grid; place-items: center; color: var(--muted); font-size: 13px; background-image: none !important; }
    .range-row { display: grid; grid-template-columns: 86px 1fr 44px; gap: 8px; align-items: center; margin-top: 8px; }
    .range-row.hidden-control { display: none; }
    .range-row label { margin: 0; }
    input[type="range"] { padding: 0; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .login-box { max-width: 460px; margin: 54px auto; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin-top: 6px; }
    .upload-status { color: var(--green-dark); font-size: 13px; font-weight: 800; line-height: 1.6; margin-top: 6px; }
    .file-actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; justify-content: start; }
    .file-actions input[type="file"] { width: 100%; min-width: 0; font-size: 12px; }
    .file-actions button { white-space: nowrap; }
    .editor-shell { overflow: visible; max-height: none; opacity: 1; transform: translateY(0); transition: opacity .2s ease, transform .2s ease; }
    .editor-shell.editor-collapsed { overflow: hidden; max-height: 0; opacity: 0; transform: translateY(-6px); pointer-events: none; }
    .preview-bg { position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(23, 31, 30, .46); }
    .preview-bg.open { display: flex; }
    .preview-modal { width: min(980px, 100%); max-height: 92vh; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 24px 70px rgba(23, 31, 30, .28); }
    .preview-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; gap: 14px; align-items: start; padding: 16px 18px; background: #faf7ef; border-bottom: 1px solid var(--line); }
    .preview-body { padding: 18px; display: grid; gap: 16px; }
    .preview-photo { width: 100%; aspect-ratio: 21 / 8; max-height: 360px; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--line); }
    .preview-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .preview-info-item { background: #f8f5ed; border: 1px solid #e7decd; border-radius: 6px; padding: 10px; }
    .preview-info-item span { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .preview-day { border-bottom: 1px solid #e4ded2; padding-bottom: 18px; line-height: 1.75; }
    .preview-day:last-child { border-bottom: 0; }
    .preview-day-title { margin-bottom: 10px; font-weight: 900; color: #173e52; }
    .preview-collage { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .preview-day-photo { aspect-ratio: 4 / 3; border-radius: 8px; background-size: cover; background-position: center; border: 1px solid var(--line); }
    .preview-text { white-space: pre-wrap; border-left: 3px solid var(--green); background: #fffefa; padding: 12px; border-radius: 6px; }
    .library-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; padding: 18px; }
    .library-item { min-height: 118px; border: 1px solid var(--line); border-radius: 8px; background-size: cover; background-position: center; box-shadow: inset 0 0 0 1px rgba(255,255,255,.55); }
    .library-empty { padding: 24px 18px; color: var(--muted); line-height: 1.7; }
    .library-filters { display: grid; grid-template-columns: minmax(160px, 220px) minmax(160px, 220px) 1fr; gap: 10px; align-items: end; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #faf7ef; }
    .library-count { color: var(--muted); font-size: 13px; font-weight: 800; padding-bottom: 10px; }
    .library-caption { display: block; width: 100%; min-height: 30px; margin-top: 88px; padding: 5px 7px; border-radius: 0 0 7px 7px; background: rgba(255, 253, 248, .9); color: #26302f; font-size: 12px; line-height: 1.35; text-align: left; }

    @media (max-width: 780px) {
      .top, .grid, .grid-3 { grid-template-columns: 1fr; display: grid; }
      .top { align-items: start; }
      .file-actions { grid-template-columns: 1fr; }
      .library-filters { grid-template-columns: 1fr; }
      .preview-info, .preview-collage { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div>
        <h1>行程後台</h1>
        <p class="muted">填好資料後儲存，前台會用目前的行程小本本版型顯示。</p>
      </div>
      <div class="toolbar">
        <a href="index.html"><button class="ghost" type="button">看前台</button></a>
        <a href="admin-inquiries.html"><button class="ghost" type="button">詢問單</button></a>
        <button class="secondary hidden" id="logoutBtn" type="button">登出</button>
      </div>
    </section>

    <section class="panel login-box" id="loginPanel">
      <h2>管理者登入</h2>
      <div class="field"><label for="loginEmail">e-mail</label><input id="loginEmail" type="email" autocomplete="username"></div>
      <div class="field"><label for="loginPassword">密碼</label><input id="loginPassword" type="password" autocomplete="current-password"></div>
      <button class="primary" id="loginBtn" type="button">登入</button>
      <p class="message" id="loginMessage"></p>
    </section>

    <section id="adminPanel" class="hidden">
      <div class="panel">
        <div class="toolbar">
          <button class="secondary" type="button" id="newTourBtn">＋ 新增行程</button>
          <button class="ghost" type="button" id="loadToursBtn">重新讀取</button>
        </div>
        <div class="field" style="margin-top:12px">
          <label for="tourSelect">已儲存行程</label>
          <select id="tourSelect"></select>
          <div class="hint" id="editorModeHint">請先選擇已儲存行程，或按「＋ 新增行程」。</div>
        </div>
      </div>

      <div id="editorPanel" class="editor-shell editor-collapsed">
      <form class="panel" id="tourForm">
        <h2>行程基本資料</h2>
        <div class="field">
          <label for="region">行程地區</label>
          <select id="region">
            <option value=""></option>
            <option value="北海道">北海道</option>
            <option value="東北">東北</option>
            <option value="關東">關東</option>
            <option value="中部・北陸">中部・北陸</option>
            <option value="關西">關西</option>
            <option value="中國・四國">中國・四國</option>
            <option value="九州・沖繩">九州・沖繩</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <div class="grid">
          <div class="field"><label for="title">大標題</label><input id="title" required></div>
          <div class="field"><label for="subtitle">副標題</label><input id="subtitle"></div>
        </div>
        <div class="grid">
          <div class="field"><label for="price">售價</label><input id="price" placeholder="NT$ 49,800 起"></div>
          <div class="field"><label for="daysCount">旅遊天數</label><select id="daysCount"></select></div>
        </div>
        <input id="heroImage" type="hidden">
        <div class="image-controls">
          <h4>旅遊主題橫幅</h4>
          <div class="image-preview hero-preview empty" id="heroPreview" data-file-input="heroImageFile">尚未選擇圖片</div>
          <div class="file-actions">
            <input id="heroImageFile" type="file" accept="image/jpeg,image/png,image/webp">
            <button class="ghost" type="button" onclick="openImageLibrary('hero')">圖片庫</button>
            <button class="secondary" type="button" onclick="clearHeroImage()">刪除圖片</button>
          </div>
          <div class="hint">可直接拖曳圖片調整位置，滾動滑鼠滾輪可縮放。</div>
          <div class="upload-status" id="heroUploadMessage"></div>
          <div class="range-row hidden-control"><label for="heroPosX">左右</label><input id="heroPosX" type="range" min="0" max="100" value="50" oninput="syncRangeValue('heroPosX')"><span id="heroPosXValue">50%</span></div>
          <div class="range-row hidden-control"><label for="heroPosY">上下</label><input id="heroPosY" type="range" min="0" max="100" value="50" oninput="syncRangeValue('heroPosY')"><span id="heroPosYValue">50%</span></div>
          <div class="range-row hidden-control"><label for="heroZoom">縮放</label><input id="heroZoom" type="range" min="100" max="180" value="100" oninput="syncRangeValue('heroZoom')"><span id="heroZoomValue">100%</span></div>
        </div>
        <div class="field"><label for="notice">注意事項</label><textarea id="notice"></textarea></div>

        <h2>航班資訊</h2>
        <div class="grid">
          <div>
            <h3>去程</h3>
            <div class="grid">
              <div class="field"><label for="outAirline">航空公司</label><select id="outAirline"><option value=""></option><option value="中華航空">中華航空</option><option value="長榮航空">長榮航空</option><option value="星宇航空">星宇航空</option><option value="國泰航空">國泰航空</option></select></div>
              <div class="field"><label for="outFlightNo">班機</label><input id="outFlightNo"></div>
            </div>
            <div class="field"><label for="outDate">日期欄位</label><input id="outDate"></div>
            <div class="grid">
              <div class="field"><label for="outDepartPlace">出發機場</label><select id="outDepartPlace"><option value=""></option><option value="桃園國際機場">桃園國際機場</option><option value="高雄國際機場">高雄國際機場</option></select></div>
              <div class="field"><label for="outDepartTime">出發時間</label><input id="outDepartTime"></div>
            </div>
            <div class="grid">
              <div class="field"><label for="outArrivePlace">抵達機場</label><input id="outArrivePlace"></div>
              <div class="field"><label for="outArriveTime">抵達時間</label><input id="outArriveTime"></div>
            </div>
          </div>
          <div>
            <h3>回程</h3>
            <div class="grid">
              <div class="field"><label for="backAirline">航空公司</label><select id="backAirline"><option value=""></option><option value="中華航空">中華航空</option><option value="長榮航空">長榮航空</option><option value="星宇航空">星宇航空</option><option value="國泰航空">國泰航空</option></select></div>
              <div class="field"><label for="backFlightNo">班機</label><input id="backFlightNo"></div>
            </div>
            <div class="field"><label for="backDate">日期欄位</label><input id="backDate"></div>
            <div class="grid">
              <div class="field"><label for="backDepartPlace">出發機場</label><input id="backDepartPlace"></div>
              <div class="field"><label for="backDepartTime">出發時間</label><input id="backDepartTime"></div>
            </div>
            <div class="grid">
              <div class="field"><label for="backArrivePlace">抵達機場</label><select id="backArrivePlace"><option value=""></option><option value="桃園國際機場">桃園國際機場</option><option value="高雄國際機場">高雄國際機場</option></select></div>
              <div class="field"><label for="backArriveTime">抵達時間</label><input id="backArriveTime"></div>
            </div>
          </div>
        </div>
      </form>

      <section class="panel">
        <h2>每天行程</h2>
        <div id="daysArea"></div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <button class="primary" type="button" id="saveBtn">預覽／儲存修改</button>
          <button class="secondary" type="button" id="duplicateBtn">複製這筆</button>
          <button class="ghost" type="button" id="shareLinkBtn">複製前台連結</button>
          <button class="danger" type="button" id="deleteBtn">刪除這筆</button>
        </div>
        <p class="message" id="saveMessage"></p>
      </section>
      </div>
    </section>
  </main>

  <div class="preview-bg" id="previewModal">
    <section class="preview-modal">
      <div class="preview-head">
        <div>
          <h2 id="previewTitle">行程預覽</h2>
          <p class="muted" id="previewSubtitle"></p>
        </div>
        <div class="toolbar">
          <button class="secondary" type="button" onclick="closePreview()">修改</button>
          <button class="primary" type="button" onclick="confirmPublish()">確認上架</button>
        </div>
      </div>
      <div class="preview-body" id="previewBody"></div>
    </section>
  </div>

  <div class="preview-bg" id="imageLibraryModal">
    <section class="preview-modal" role="dialog" aria-modal="true" aria-labelledby="imageLibraryTitle">
      <div class="preview-head">
        <div>
          <h2 id="imageLibraryTitle">圖片庫</h2>
          <p class="muted">這裡會列出目前已儲存行程使用過的圖片。</p>
        </div>
        <button class="secondary" type="button" onclick="closeImageLibrary()">關閉</button>
      </div>
      <div id="imageLibraryBody"></div>
    </section>
  </div>

  <script>
    const supabaseUrl = "https://awlrmtyynguetdsxswgc.supabase.co";
    const supabaseKey = "sb_publishable_-3c0c7c4grzS7_OaNfRALw_Xv31hjIT";
    const client = supabase.createClient(supabaseUrl, supabaseKey);
    const $ = (id) => document.getElementById(id);
    const imageBucket = "itinerary-images";
    let currentId = null;
    let savedTours = [];
    const pendingDayImageFiles = {};
    let hasUnsavedChanges = false;
    let idleLogoutTimer = null;
    let imageLibraryTarget = null;
    let imageLibraryItems = [];
    const idleLogoutMs = 10 * 60 * 1000;
    const regionOrder = ["北海道", "東北", "關東", "中部・北陸", "關西", "中國・四國", "九州・沖繩", "其他"];
    const prefectureGroups = {
      "北海道": ["北海道"],
      "東北": ["青森", "岩手", "秋田", "山形", "宮城", "福島"],
      "關東": ["東京", "千葉", "埼玉", "神奈川", "茨城", "栃木", "群馬"],
      "中部・北陸": ["愛知", "靜岡", "山梨", "長野", "新潟", "富山", "石川", "福井", "岐阜"],
      "關西": ["大阪", "京都", "奈良", "兵庫", "和歌山", "滋賀", "三重"],
      "中國・四國": ["廣島", "岡山", "鳥取", "島根", "山口", "香川", "德島", "愛媛", "高知"],
      "九州・沖繩": ["福岡", "佐賀", "長崎", "大分", "熊本", "宮崎", "鹿兒島", "沖繩"],
      "其他": ["未分類"]
    };

    for (let i = 1; i <= 10; i += 1) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = `${i} 天`;
      if (i === 5) option.selected = true;
      $("daysCount").appendChild(option);
    }

    $("loginBtn").addEventListener("click", login);
    $("loginPassword").addEventListener("keydown", (event) => { if (event.key === "Enter") login(); });
    $("logoutBtn").addEventListener("click", async () => {
      if (!confirmLeaveUnsaved()) return;
      await logout();
    });
    $("daysCount").addEventListener("change", () => {
      markDirty();
      renderDayEditors(Number($("daysCount").value));
    });
    $("saveBtn").addEventListener("click", showPreview);
    $("duplicateBtn").addEventListener("click", duplicateCurrentTour);
    $("shareLinkBtn").addEventListener("click", copyFrontendLink);
    $("loadToursBtn").addEventListener("click", () => {
      if (confirmLeaveUnsaved()) loadTours();
    });
    $("newTourBtn").addEventListener("click", newTour);
    $("deleteBtn").addEventListener("click", deleteTour);
    $("tourSelect").addEventListener("change", () => {
      if (!confirmLeaveUnsaved()) {
        $("tourSelect").value = currentId || "";
        return;
      }
      if (!$("tourSelect").value) {
        hideEditor();
        return;
      }
      if ($("tourSelect").value === "__new__") {
        newTour(true);
        return;
      }
      const tour = savedTours.find((item) => item.id === $("tourSelect").value);
      if (tour) fillForm(tour);
    });
    $("heroImage").addEventListener("input", () => updatePreview("heroPreview", $("heroImage").value, "hero"));
    $("heroImageFile").addEventListener("change", () => previewSelectedFiles("heroImageFile", "heroPreview", "hero"));
    $("previewModal").addEventListener("click", (event) => {
      if (event.target === $("previewModal")) closePreview();
    });
    $("imageLibraryModal").addEventListener("click", (event) => {
      if (event.target === $("imageLibraryModal")) closeImageLibrary();
    });

    init();
    watchEditableFields($("editorPanel"));
    window.addEventListener("beforeunload", (event) => {
      if (!hasUnsavedChanges) return;
      event.preventDefault();
      event.returnValue = "資料尚未儲存，確定離開此頁？";
    });
    ["pointerdown", "keydown", "scroll", "touchstart"].forEach((eventName) => {
      window.addEventListener(eventName, resetIdleLogoutTimer, { passive: true });
    });

    async function init() {
      renderDayEditors(5);
      const logoutMessage = sessionStorage.getItem("adminLogoutMessage");
      if (logoutMessage) {
        $("loginMessage").textContent = logoutMessage;
        sessionStorage.removeItem("adminLogoutMessage");
      }
      const { data } = await client.auth.getSession();
      if (data.session) showAdmin();
    }

    async function login() {
      $("loginMessage").textContent = "登入中...";
      const { error } = await client.auth.signInWithPassword({
        email: $("loginEmail").value.trim(),
        password: $("loginPassword").value
      });
      if (error) {
        $("loginMessage").textContent = "登入失敗，請確認帳號密碼。";
        return;
      }
      showAdmin();
    }

    async function showAdmin() {
      $("loginPanel").classList.add("hidden");
      $("adminPanel").classList.remove("hidden");
      $("logoutBtn").classList.remove("hidden");
      resetIdleLogoutTimer();
      await loadTours();
    }

    async function logout(message = "") {
      clearTimeout(idleLogoutTimer);
      idleLogoutTimer = null;
      hasUnsavedChanges = false;
      await client.auth.signOut();
      if (message) sessionStorage.setItem("adminLogoutMessage", message);
      location.reload();
    }

    function resetIdleLogoutTimer() {
      if ($("adminPanel").classList.contains("hidden")) return;
      clearTimeout(idleLogoutTimer);
      idleLogoutTimer = setTimeout(() => {
        logout("已閒置 10 分鐘，系統已自動登出。");
      }, idleLogoutMs);
    }

    async function loadTours() {
      const keepId = currentId;
      const { data, error } = await client.from("site_tours").select("*").order("sort_order", { ascending: true }).order("created_at", { ascending: false });
      if (error) {
        savedTours = [];
        renderTourSelect();
        hideEditor();
        $("saveMessage").textContent = "目前讀不到資料庫，請稍後再試。";
        return;
      }
      savedTours = data || [];
      renderTourSelect();
      if (keepId) {
        const selected = savedTours.find((tour) => tour.id === keepId);
        if (selected) fillForm(selected);
      } else {
        hideEditor();
      }
    }

    function renderTourSelect() {
      const groups = new Map(regionOrder.map((region) => [region, []]));
      savedTours.forEach((tour) => {
        const region = getTourRegion(tour);
        if (!groups.has(region)) groups.set(region, []);
        groups.get(region).push(tour);
      });
      $("tourSelect").innerHTML = `<option value="">請選擇行程</option><option value="__new__">＋ 新增行程</option>` + Array.from(groups.entries())
        .filter(([, tours]) => tours.length)
        .map(([region, tours]) => `<optgroup label="${escapeAttr(region)}">${tours.map((tour) => `<option value="${tour.id}">${escapeText(tour.title || "未命名行程")}</option>`).join("")}</optgroup>`)
        .join("");
      $("tourSelect").value = currentId || "";
    }

    function getTourRegion(tour) {
      return tour.payload?.region || inferRegion(`${tour.title || ""} ${tour.subtitle || ""} ${tour.payload?.title || ""} ${tour.payload?.subtitle || ""}`);
    }

    function inferRegion(text) {
      if (/北海道|札幌|函館|小樽|富良野|旭川|帶廣|釧路|知床/.test(text)) return "北海道";
      if (/東北|青森|秋田|岩手|山形|宮城|福島|仙台|藏王|銀山/.test(text)) return "東北";
      if (/關東|東京|千葉|埼玉|神奈川|橫濱|箱根|日光|茨城|栃木|群馬/.test(text)) return "關東";
      if (/中部|北陸|名古屋|愛知|靜岡|山梨|長野|新潟|富山|石川|福井|岐阜|金澤|立山|白川鄉|高山/.test(text)) return "中部・北陸";
      if (/關西|大阪|京都|奈良|兵庫|神戶|和歌山|滋賀|三重/.test(text)) return "關西";
      if (/中國|四國|廣島|岡山|鳥取|島根|山口|香川|德島|愛媛|高知/.test(text)) return "中國・四國";
      if (/九州|沖繩|福岡|佐賀|長崎|大分|熊本|宮崎|鹿兒島|那霸|石垣|別府|阿蘇|湯布院|人吉/.test(text)) return "九州・沖繩";
      return "其他";
    }

        ["香川", /香川|高松|小豆島|琴平/],

        ["愛媛", /愛媛|松山|道後|今治/],
        ["高知", /高知|四萬十|四万十|桂濱|桂浜/],
        ["福岡", /福岡|博多|太宰府|門司港/],

        ["熊本", /熊本|阿蘇|黑川|黒川|人吉|天草/],

    function newTour(skipConfirm = false) {
      if (!skipConfirm && !confirmLeaveUnsaved()) return;
      currentId = null;
      $("tourForm").reset();
      $("daysCount").value = 5;
      renderDayEditors(5);
      $("saveMessage").textContent = "已建立空白編輯畫面，填好後按儲存。";
      $("editorModeHint").textContent = "正在新增：空白行程";
      if ($("tourSelect")) $("tourSelect").value = "__new__";
      showEditor();
      markClean();
    }

    function duplicateCurrentTour() {
      if (!currentId) {
        $("saveMessage").textContent = "請先選擇一筆已儲存行程，再使用複製。";
        return;
      }
      const payload = collectPayload();
      currentId = null;
      $("title").value = `${payload.title || "未命名行程"} 複製`;
      if ($("tourSelect")) $("tourSelect").value = "__new__";
      $("editorModeHint").textContent = "正在新增：由既有行程複製而來";
      $("saveMessage").textContent = "已複製成新行程，確認內容後按「預覽／儲存修改」就會新增一筆。";
      markDirty();
    }

    async function copyFrontendLink() {
      if (!currentId) {
        $("saveMessage").textContent = "請先選擇已儲存行程，儲存後才能複製前台連結。";
        return;
      }
      const url = `${location.origin}${location.pathname.replace(/admin-tours\.html$/, "index.html")}?tour=${encodeURIComponent(currentId)}`;
      try {
        await navigator.clipboard.writeText(url);
        $("saveMessage").textContent = "前台行程連結已複製。";
      } catch (error) {
        prompt("請複製這個前台連結：", url);
      }
    }

    function showEditor() {
      $("editorPanel").classList.remove("editor-collapsed");
    }

    function hideEditor() {
      currentId = null;
      $("editorPanel").classList.add("editor-collapsed");
      if ($("tourSelect")) $("tourSelect").value = "";
      $("editorModeHint").textContent = "請先選擇已儲存行程，或按「＋ 新增行程」。";
      markClean();
    }

    function renderDayEditors(count, days = []) {
      $("daysArea").innerHTML = "";
      for (let i = 0; i < count; i += 1) {
        const day = days[i] || {};
        const styles = day.imageStyles || [];
        const div = document.createElement("div");
        div.className = "day-card";
        div.innerHTML = `
          <div class="day-head"><h3>Day ${i + 1}</h3></div>
          <div class="field"><label>當天行程標題</label><input id="dayTitle${i}" value="${escapeAttr(day.title || "")}"></div>
          ${[0, 1, 2].map((n) => `<input id="dayImage${i}_${n}" type="hidden" value="${escapeAttr((day.images || [])[n] || "")}">`).join("")}
          <div class="grid-3 image-control-grid">
            ${[0, 1, 2].map((n) => imageControlHtml(i, n, styles[n])).join("")}
          </div>
          <div class="upload-status" id="dayUploadMessage${i}"></div>
          <div class="field"><label>展開行程內容</label><textarea id="dayDetail${i}">${escapeText(day.detail || "")}</textarea></div>
          <div class="grid">
            <div class="field"><label>早餐</label><input id="dayBreakfast${i}" value="${escapeAttr(day.breakfast || "")}"></div>
            <div class="field"><label>午餐</label><input id="dayLunch${i}" value="${escapeAttr(day.lunch || "")}"></div>
            <div class="field"><label>晚餐</label><input id="dayDinner${i}" value="${escapeAttr(day.dinner || "")}"></div>
            <div class="field"><label>住宿</label><input id="dayHotel${i}" value="${escapeAttr(day.hotel || "")}"></div>
          </div>
        `;
        $("daysArea").appendChild(div);
        [0, 1, 2].forEach((n) => {
          $(`dayImage${i}_${n}`).addEventListener("input", () => updatePreview(`dayPreview${i}_${n}`, $(`dayImage${i}_${n}`).value, `dayImageStyle${i}_${n}`));
          updatePreview(`dayPreview${i}_${n}`, $(`dayImage${i}_${n}`).value, `dayImageStyle${i}_${n}`);
        $(`dayImageFile${i}_${n}`).addEventListener("change", () => previewSlotSelectedFile(i, n));
        });
      }
      updatePreview("heroPreview", $("heroImage").value, "hero");
      watchEditableFields($("daysArea"));
    }

    function imageControlHtml(dayIndex, imageIndex, style = {}) {
      const prefix = `dayImageStyle${dayIndex}_${imageIndex}`;
      const x = Number(style.x ?? 50);
      const y = Number(style.y ?? 50);
      const zoom = Number(style.zoom ?? 100);
      return `
        <div class="image-controls">
          <h4>圖片 ${imageIndex + 1} 顯示調整</h4>
          <div class="image-preview day-preview empty" id="dayPreview${dayIndex}_${imageIndex}" data-file-input="dayImageFile${dayIndex}_${imageIndex}">尚未選擇圖片</div>
          <div class="file-actions">
            <input id="dayImageFile${dayIndex}_${imageIndex}" type="file" accept="image/jpeg,image/png,image/webp">
            <button class="ghost" type="button" onclick="openImageLibrary('day', ${dayIndex}, ${imageIndex})">圖片庫</button>
            <button class="secondary" type="button" onclick="clearDayImage(${dayIndex}, ${imageIndex})">刪除圖片</button>
          </div>
          <div class="hint">可拖曳調整位置，滾輪可縮放。</div>
          <div class="range-row hidden-control"><label for="${prefix}X">左右</label><input id="${prefix}X" type="range" min="0" max="100" value="${x}" oninput="syncRangeValue('${prefix}X')"><span id="${prefix}XValue">${x}%</span></div>
          <div class="range-row hidden-control"><label for="${prefix}Y">上下</label><input id="${prefix}Y" type="range" min="0" max="100" value="${y}" oninput="syncRangeValue('${prefix}Y')"><span id="${prefix}YValue">${y}%</span></div>
          <div class="range-row hidden-control"><label for="${prefix}Zoom">縮放</label><input id="${prefix}Zoom" type="range" min="100" max="180" value="${zoom}" oninput="syncRangeValue('${prefix}Zoom')"><span id="${prefix}ZoomValue">${zoom}%</span></div>
        </div>
      `;
    }

    function syncRangeValue(id) {
      if ($(id) && $(`${id}Value`)) $(`${id}Value`).textContent = `${$(id).value}%`;
      const heroMap = { heroPosX: "hero", heroPosY: "hero", heroZoom: "hero" };
      if (heroMap[id]) updatePreview("heroPreview", $("heroImage").value, "hero");
      const match = id.match(/^dayImageStyle(\d+)_(\d+)(X|Y|Zoom)$/);
      if (match) {
        const dayIndex = match[1];
        const imageIndex = match[2];
        updatePreview(`dayPreview${dayIndex}_${imageIndex}`, $(`dayImage${dayIndex}_${imageIndex}`).value, `dayImageStyle${dayIndex}_${imageIndex}`);
      }
    }

    function styleForPreview(prefix) {
      const style = prefix === "hero" ? collectHeroStyle() : collectImageStyle(prefix);
      const size = style.zoom === 100 ? "cover" : `${style.zoom}%`;
      return { position: `${style.x}% ${style.y}%`, size };
    }

    function collectHeroStyle() {
      return {
        x: Number($("heroPosX")?.value || 50),
        y: Number($("heroPosY")?.value || 50),
        zoom: Number($("heroZoom")?.value || 100)
      };
    }

    function updatePreview(previewId, url, stylePrefix) {
      const preview = $(previewId);
      if (!preview) return;
      attachPreviewGestures(previewId, stylePrefix);
      if (url && !url.startsWith("blob:")) preview.dataset.previewSrc = url;
      const src = preview.dataset.localUrl || url || preview.dataset.previewSrc || "";
      if (!src) {
        preview.classList.add("empty");
        preview.textContent = "尚未選擇圖片";
        preview.style.backgroundImage = "";
        return;
      }
      const { position, size } = styleForPreview(stylePrefix);
      preview.classList.remove("empty");
      preview.textContent = "";
      preview.style.backgroundImage = `url("${src.replaceAll('"', "%22")}")`;
      preview.style.backgroundPosition = position;
      preview.style.backgroundSize = size;
    }

    function attachPreviewGestures(previewId, stylePrefix) {
      const preview = $(previewId);
      if (!preview || preview.dataset.gestureReady) return;
      preview.dataset.gestureReady = "true";
      let startX = 0;
      let startY = 0;
      let startStyle = null;

      preview.addEventListener("pointerdown", (event) => {
        if (preview.classList.contains("empty")) {
          const inputId = preview.dataset.fileInput;
          if (inputId && $(inputId)) $(inputId).click();
          return;
        }
        event.preventDefault();
        startX = event.clientX;
        startY = event.clientY;
        startStyle = getStyleValues(stylePrefix);
        preview.classList.add("dragging");
        preview.setPointerCapture(event.pointerId);
      });

      preview.addEventListener("pointermove", (event) => {
        if (!startStyle) return;
        const rect = preview.getBoundingClientRect();
        const dx = ((event.clientX - startX) / rect.width) * 100;
        const dy = ((event.clientY - startY) / rect.height) * 100;
        setStyleValues(stylePrefix, {
          x: clamp(startStyle.x - dx, 0, 100),
          y: clamp(startStyle.y - dy, 0, 100),
          zoom: startStyle.zoom
        });
        updatePreview(previewId, "", stylePrefix);
        markDirty();
      });

      preview.addEventListener("pointerup", (event) => {
        startStyle = null;
        preview.classList.remove("dragging");
        if (preview.hasPointerCapture(event.pointerId)) preview.releasePointerCapture(event.pointerId);
      });

      preview.addEventListener("pointercancel", () => {
        startStyle = null;
        preview.classList.remove("dragging");
      });

      preview.addEventListener("wheel", (event) => {
        if (preview.classList.contains("empty")) return;
        event.preventDefault();
        const current = getStyleValues(stylePrefix);
        const step = event.deltaY > 0 ? -5 : 5;
        setStyleValues(stylePrefix, {
          ...current,
          zoom: clamp(current.zoom + step, 100, 180)
        });
        updatePreview(previewId, "", stylePrefix);
        markDirty();
      }, { passive: false });
    }

    function getStyleValues(prefix) {
      if (prefix === "hero") return collectHeroStyle();
      return collectImageStyle(prefix);
    }

    function setStyleValues(prefix, style) {
      const idPrefix = prefix === "hero" ? "heroPos" : prefix;
      [["X", style.x], ["Y", style.y], ["Zoom", style.zoom]].forEach(([suffix, value]) => {
        const id = `${idPrefix}${suffix}`;
        if ($(id)) {
          $(id).value = Math.round(value);
          syncRangeValue(id);
        }
      });
    }

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function previewSelectedFiles(inputId, previewId, stylePrefix, dayIndex = null) {
      const files = Array.from($(inputId)?.files || []);
      if (!files.length) return;
      if (dayIndex === null) {
        const url = URL.createObjectURL(files[0]);
        const preview = $(previewId);
        if (preview?.dataset.localUrl) URL.revokeObjectURL(preview.dataset.localUrl);
        preview.dataset.localUrl = url;
        updatePreview(previewId, url, stylePrefix);
        markDirty();
        return;
      }
      const slots = [0, 1, 2].filter((index) => !$(`dayImage${dayIndex}_${index}`).value.trim());
      const targetSlots = slots.length ? slots : [0, 1, 2];
      files.slice(0, targetSlots.length).forEach((file, fileIndex) => {
        const index = targetSlots[fileIndex];
        const target = $(`dayImage${dayIndex}_${index}`);
        const preview = $(`dayPreview${dayIndex}_${index}`);
        if (!target || !preview) return;
        const url = URL.createObjectURL(file);
        if (preview.dataset.localUrl) URL.revokeObjectURL(preview.dataset.localUrl);
        preview.dataset.localUrl = url;
        target.value = "";
        pendingDayImageFiles[`${dayIndex}_${index}`] = file;
        updatePreview(`dayPreview${dayIndex}_${index}`, url, `dayImageStyle${dayIndex}_${index}`);
        markDirty();
      });
      $(inputId).value = "";
    }

    function previewSlotSelectedFile(dayIndex, imageIndex) {
      const input = $(`dayImageFile${dayIndex}_${imageIndex}`);
      const file = input?.files?.[0];
      if (!file) return;
      pendingDayImageFiles[`${dayIndex}_${imageIndex}`] = file;
      const preview = $(`dayPreview${dayIndex}_${imageIndex}`);
      const url = URL.createObjectURL(file);
      if (preview.dataset.localUrl) URL.revokeObjectURL(preview.dataset.localUrl);
      preview.dataset.localUrl = url;
      $(`dayImage${dayIndex}_${imageIndex}`).value = "";
      updatePreview(`dayPreview${dayIndex}_${imageIndex}`, url, `dayImageStyle${dayIndex}_${imageIndex}`);
      markDirty();
    }

    function showPreview() {
      const payload = collectPreviewPayload();
      $("previewTitle").textContent = payload.title || "未填大標題";
      $("previewSubtitle").textContent = payload.subtitle || "";
      $("previewBody").innerHTML = renderPreview(payload);
      $("previewModal").classList.add("open");
    }

    function closePreview() {
      $("previewModal").classList.remove("open");
    }

    async function confirmPublish() {
      closePreview();
      await saveTour();
    }

    function collectPreviewPayload() {
      const payload = collectPayload();
      payload.image = getPreviewImage("heroPreview", payload.image);
      payload.days = payload.days.map((day, dayIndex) => {
        const images = [0, 1, 2].map((imageIndex) => getPreviewImage(`dayPreview${dayIndex}_${imageIndex}`, day[2][imageIndex] || "")).filter(Boolean);
        return [day[0], day[1], images, day[3]];
      });
      payload.gallery = payload.days.flatMap((day) => day[2]).filter(Boolean);
      return payload;
    }

    function getPreviewImage(previewId, fallback = "") {
      const preview = $(previewId);
      return preview?.dataset.localUrl || preview?.dataset.previewSrc || fallback || "";
    }

    function renderPreview(payload) {
      const info = [
        ["天數", `${$("daysCount").value}天`],
        ["價格", payload.price || "未填"]
      ];
      return `
        ${payload.image ? `<div class="preview-photo" style="${previewImageStyle(payload.image, payload.heroStyle)}"></div>` : ""}
        <div class="preview-info">
          ${info.map(([label, value]) => `<div class="preview-info-item"><span>${escapeText(label)}</span><strong>${escapeText(value)}</strong></div>`).join("")}
        </div>
        ${renderPreviewFlights(payload.flights)}
        <div>
        ${payload.days.map((day, index) => renderPreviewDay(day, index)).join("")}
        </div>
        ${payload.notice ? `<div class="preview-text">${escapeText(payload.notice)}</div>` : ""}
      `;
    }

    function renderPreviewFlights(flights) {
      const rows = (flights || []).filter((flight) => Object.values(flight).some(Boolean));
      if (!rows.length) return "";
      return `<div class="panel" style="box-shadow:none;margin:0"><h3>參考航班</h3>${rows.map((flight) => `
        <div class="preview-info-item" style="margin-top:8px">
          <strong>${escapeText(flight.type || "")} ${escapeText(flight.airline || "")} ${escapeText(flight.flightNo || "")}</strong>
          <div class="muted">${escapeText(flight.date || "")}　${escapeText(flight.departPlace || "")} ${escapeText(flight.departTime || "")} → ${escapeText(flight.arrivePlace || "")} ${escapeText(flight.arriveTime || "")}</div>
        </div>
      `).join("")}</div>`;
    }

    function renderPreviewDay(day, index) {
      const title = (day[0] || "").replace(/^Day\s*\d+\s*/i, "");
      const body = day[1] || "";
      const mealStart = body.indexOf("早餐：");
      const detail = mealStart >= 0 ? body.slice(0, mealStart).trim() : body.trim();
      const meals = mealStart >= 0 ? body.slice(mealStart).trim() : "";
      const imageList = (day[2] || []).filter(Boolean).slice(0, 3);
      const styles = Array.isArray(day[3]) ? day[3] : [];
      return `
        <section class="preview-day">
          <div class="preview-day-title">第 ${index + 1} 天　${escapeText(title || "未填行程標題")}</div>
          ${imageList.length ? `<div class="preview-collage">${imageList.map((image, imageIndex) => `<div class="preview-day-photo" style="${previewImageStyle(image, styles[imageIndex])}"></div>`).join("")}</div>` : ""}
          ${detail ? `<div class="preview-text">${escapeText(detail)}</div>` : ""}
          ${meals ? `<div class="preview-text" style="margin-top:8px">${escapeText(meals)}</div>` : ""}
        </section>
      `;
    }

    function previewImageStyle(url, style = {}) {
      if (!url) return "";
      const x = Number(style?.x ?? 50);
      const y = Number(style?.y ?? 50);
      const zoom = Number(style?.zoom ?? 100);
      const size = zoom === 100 ? "cover" : `${zoom}%`;
      return `background-image:url('${String(url || "").replaceAll("'", "\\'")}');background-position:${x}% ${y}%;background-size:${size};`;
    }

    async function saveTour() {
      $("saveMessage").textContent = "儲存中...";
      try {
        await uploadPendingTourImages();
      } catch (error) {
        $("saveMessage").textContent = error.message;
        return;
      }
      const payload = collectPayload();
      const row = {
        slug: slugify(payload.title),
        title: payload.title,
        subtitle: payload.subtitle,
        price: payload.price,
        hero_image: payload.image,
        is_published: true,
        sort_order: 10,
        payload
      };
      let result;
      const isUpdatingSavedTour = Boolean(currentId);
      if (isUpdatingSavedTour) {
        result = await client.from("site_tours").update(row).eq("id", currentId).select().single();
      } else {
        result = await client.from("site_tours").insert(row).select().single();
      }
      if (result.error) {
        $("saveMessage").textContent = `儲存失敗：${result.error.message}`;
        return;
      }
      currentId = result.data.id;
      $("saveMessage").textContent = isUpdatingSavedTour ? "已儲存修改，可以到前台重新整理看看。" : "已新增行程，可以到前台重新整理看看。";
      await loadTours();
      markClean();
    }

    async function uploadPendingTourImages() {
      const uploadKey = currentId ? safeStorageSegment(currentId) : createUploadKey();
      if ($("heroImageFile").files.length) {
        const urls = await uploadFiles("heroImageFile", `tours/${uploadKey}/hero`, "heroUploadMessage");
        if (urls[0]) {
          $("heroImage").value = urls[0];
          clearLocalPreview("heroPreview");
          updatePreview("heroPreview", urls[0], "hero");
        }
      }
      for (let i = 0; i < Number($("daysCount").value); i += 1) {
        for (let n = 0; n < 3; n += 1) {
          const file = pendingDayImageFiles[`${i}_${n}`];
          if (!file) continue;
          const urls = await uploadFileList([file], `tours/${uploadKey}/day-${i + 1}`, `dayUploadMessage${i}`);
          if (urls[0]) {
            $(`dayImage${i}_${n}`).value = urls[0];
            clearLocalPreview(`dayPreview${i}_${n}`);
            updatePreview(`dayPreview${i}_${n}`, urls[0], `dayImageStyle${i}_${n}`);
          }
          delete pendingDayImageFiles[`${i}_${n}`];
        }
      }
    }

    function addUploadedDayImage(dayIndex, url) {
      for (let i = 0; i < 3; i += 1) {
        const input = $(`dayImage${dayIndex}_${i}`);
        if (input && !input.value) {
          input.value = url;
          return;
        }
      }
      $(`dayImage${dayIndex}_0`).value = url;
    }

    function openImageLibrary(type, dayIndex = null, imageIndex = null) {
      imageLibraryTarget = { type, dayIndex, imageIndex };
      imageLibraryItems = collectImageLibraryItems();
      if (!imageLibraryItems.length) {
        $("imageLibraryBody").innerHTML = `<div class="library-empty">目前還沒有可重複使用的圖片。先儲存一筆有圖片的行程後，這裡就會出現圖片。</div>`;
      } else {
        $("imageLibraryBody").innerHTML = `
          <div class="library-filters">
            <div>
              <label for="libraryRegionFilter">地區</label>
              <select id="libraryRegionFilter" onchange="renderImageLibraryGrid()"></select>
            </div>
            <div>
              <label for="libraryPrefectureFilter">細項</label>
              <select id="libraryPrefectureFilter" onchange="renderImageLibraryGrid()"></select>
            </div>
            <div class="library-count" id="libraryCount"></div>
          </div>
          <div id="libraryGridArea"></div>
        `;
        renderImageLibraryFilters();
        renderImageLibraryGrid();
      }
      $("imageLibraryModal").classList.add("open");
    }

    function closeImageLibrary() {
      $("imageLibraryModal").classList.remove("open");
      imageLibraryTarget = null;
    }

    function chooseLibraryImage(url) {
      if (!imageLibraryTarget) return;
      if (imageLibraryTarget.type === "hero") {
        $("heroImage").value = url;
        $("heroImageFile").value = "";
        clearLocalPreview("heroPreview");
        updatePreview("heroPreview", url, "hero");
      } else {
        const { dayIndex, imageIndex } = imageLibraryTarget;
        const inputId = `dayImage${dayIndex}_${imageIndex}`;
        const fileId = `dayImageFile${dayIndex}_${imageIndex}`;
        const previewId = `dayPreview${dayIndex}_${imageIndex}`;
        $(inputId).value = url;
        $(fileId).value = "";
        delete pendingDayImageFiles[`${dayIndex}_${imageIndex}`];
        clearLocalPreview(previewId);
        updatePreview(previewId, url, `dayImageStyle${dayIndex}_${imageIndex}`);
      }
      markDirty();
      closeImageLibrary();
    }

    function renderImageLibraryFilters() {
      const regions = regionOrder.filter((region) => imageLibraryItems.some((item) => item.region === region));
      $("libraryRegionFilter").innerHTML = `<option value="">全部地區</option>${regions.map((region) => `<option value="${escapeAttr(region)}">${escapeText(region)}</option>`).join("")}`;
      $("libraryPrefectureFilter").innerHTML = `<option value="">全部細項</option>`;
      $("libraryRegionFilter").addEventListener("change", () => {
        renderImageLibraryPrefectureFilter();
        renderImageLibraryGrid();
      });
      renderImageLibraryPrefectureFilter();
    }

    function renderImageLibraryPrefectureFilter() {
      const region = $("libraryRegionFilter")?.value || "";
      const prefectures = Array.from(new Set(imageLibraryItems
        .filter((item) => !region || item.region === region)
        .map((item) => item.prefecture || "未分類")))
        .sort((a, b) => getPrefectureOrder(region, a) - getPrefectureOrder(region, b) || a.localeCompare(b, "zh-Hant"));
      $("libraryPrefectureFilter").innerHTML = `<option value="">全部細項</option>${prefectures.map((name) => `<option value="${escapeAttr(name)}">${escapeText(name)}</option>`).join("")}`;
    }

    function renderImageLibraryGrid() {
      const region = $("libraryRegionFilter")?.value || "";
      const prefecture = $("libraryPrefectureFilter")?.value || "";
      const items = imageLibraryItems.filter((item) => {
        return (!region || item.region === region) && (!prefecture || item.prefecture === prefecture);
      });
      $("libraryCount").textContent = `共 ${items.length} 張圖片`;
      $("libraryGridArea").innerHTML = items.length
        ? `<div class="library-grid">${items.map((item) => `
          <button class="library-item" type="button" style="${previewImageStyle(item.url)}" onclick="chooseLibraryImage('${escapeJs(item.url)}')" aria-label="選擇圖片">
            <span class="library-caption">${escapeText(item.region)}／${escapeText(item.prefecture)}<br>${escapeText(item.title || "圖片")}</span>
          </button>
        `).join("")}</div>`
        : `<div class="library-empty">這個分類目前沒有圖片。</div>`;
    }

    function getPrefectureOrder(region, prefecture) {
      const list = prefectureGroups[region] || Object.values(prefectureGroups).flat();
      const index = list.indexOf(prefecture);
      return index >= 0 ? index : 999;
    }

    function collectImageLibraryItems() {
      const items = [];
      const seen = new Set();
      savedTours.forEach((tour) => {
        const payload = tour.payload || {};
        const baseText = `${tour.title || ""} ${tour.subtitle || ""} ${payload.title || ""} ${payload.subtitle || ""} ${payload.region || ""}`;
        const baseRegion = payload.region || getTourRegion(tour);
        [payload.image, tour.hero_image].forEach((url) => addLibraryItem(items, seen, url, {
          region: baseRegion,
          text: baseText,
          title: payload.title || tour.title || "橫幅圖片"
        }));
        (payload.days || []).forEach((day) => {
          const images = Array.isArray(day?.[2]) ? day[2] : day?.[2] ? [day[2]] : [];
          const dayTitle = day?.[0] || "";
          const dayBody = day?.[1] || "";
          images.forEach((url) => addLibraryItem(items, seen, url, {
            region: baseRegion,
            text: `${baseText} ${dayTitle} ${dayBody}`,
            title: dayTitle.replace(/^Day\s*\d+\s*/i, "") || payload.title || tour.title || "DAY 圖片"
          }));
        });
      });
      return items;
    }

    function addLibraryItem(items, seen, url, meta) {
      if (typeof url !== "string" || !/^https?:\/\//.test(url) || seen.has(url)) return;
      seen.add(url);
      const region = meta.region || inferRegion(meta.text || "") || "其他";
      items.push({
        url,
        region,
        prefecture: inferPrefecture(meta.text || "", region),
        title: meta.title || ""
      });
    }

    function clearLocalPreview(previewId) {
      const preview = $(previewId);
      if (!preview) return;
      if (preview.dataset.localUrl) URL.revokeObjectURL(preview.dataset.localUrl);
      delete preview.dataset.localUrl;
      delete preview.dataset.previewSrc;
    }

    function clearHeroImage() {
      $("heroImage").value = "";
      $("heroImageFile").value = "";
      clearLocalPreview("heroPreview");
      setImageStyle("hero", { x: 50, y: 50, zoom: 100 });
      updatePreview("heroPreview", "", "hero");
      $("heroUploadMessage").textContent = "";
      markDirty();
    }

    function clearDayImage(dayIndex, imageIndex) {
      const key = `${dayIndex}_${imageIndex}`;
      delete pendingDayImageFiles[key];
      $(`dayImage${dayIndex}_${imageIndex}`).value = "";
      $(`dayImageFile${dayIndex}_${imageIndex}`).value = "";
      clearLocalPreview(`dayPreview${dayIndex}_${imageIndex}`);
      setImageStyle(`dayImageStyle${dayIndex}_${imageIndex}`, { x: 50, y: 50, zoom: 100 });
      updatePreview(`dayPreview${dayIndex}_${imageIndex}`, "", `dayImageStyle${dayIndex}_${imageIndex}`);
      $(`dayUploadMessage${dayIndex}`).textContent = "";
      markDirty();
    }

    async function uploadFiles(inputId, folder, messageId) {
      const input = $(inputId);
      const files = Array.from(input?.files || []);
      const urls = await uploadFileList(files, folder, messageId);
      input.value = "";
      return urls;
    }

    async function uploadFileList(files, folder, messageId) {
      const urls = [];
      const allowedTypes = ["image/jpeg", "image/png", "image/webp"];
      const maxSize = 5 * 1024 * 1024;
      for (const file of files) {
        if (!allowedTypes.includes(file.type)) throw new Error(`${file.name} 不是可上傳的圖片格式。`);
        if (file.size > maxSize) throw new Error(`${file.name} 超過 5MB，請先縮小圖片。`);
      }
      for (const [index, file] of files.entries()) {
        $(messageId).textContent = `圖片上傳中 ${index + 1}/${files.length}...`;
        const path = `${safeStoragePath(folder)}/${Date.now()}-${index + 1}-${safeFileName(file)}`;
        const { error } = await client.storage.from(imageBucket).upload(path, file, {
          cacheControl: "31536000",
          contentType: file.type,
          upsert: false
        });
        if (error) throw new Error(`圖片上傳失敗：${error.message}`);
        const { data } = client.storage.from(imageBucket).getPublicUrl(path);
        urls.push(data.publicUrl);
      }
      $(messageId).textContent = `已上傳 ${files.length} 張圖片。`;
      return urls;
    }

    function safeFileName(file) {
      const extension = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "") || "jpg";
      const base = file.name.replace(/\.[^.]+$/, "").normalize("NFKD").replace(/[^a-zA-Z0-9-]+/g, "-").replace(/-+/g, "-").replace(/^-|-$/g, "").toLowerCase() || "image";
      return `${base}.${extension}`;
    }

    function createUploadKey() {
      const random = Math.random().toString(36).slice(2, 8);
      return `tour-${Date.now()}-${random}`;
    }

    function safeStoragePath(path) {
      return String(path).split("/").map(safeStorageSegment).filter(Boolean).join("/");
    }

    function safeStorageSegment(value) {
      return String(value || "")
        .normalize("NFKD")
        .replace(/[^a-zA-Z0-9_-]+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .toLowerCase() || "item";
    }

    async function deleteTour() {
      if (!currentId || !confirm("確定要刪除這筆行程嗎？")) return;
      const { error } = await client.from("site_tours").delete().eq("id", currentId);
      if (error) {
        $("saveMessage").textContent = `刪除失敗：${error.message}`;
        return;
      }
      currentId = null;
      $("saveMessage").textContent = "已刪除。";
      await loadTours();
      hideEditor();
    }

    function collectPayload() {
      const days = [];
      for (let i = 0; i < Number($("daysCount").value); i += 1) {
        const title = `Day ${i + 1}  ${$(`dayTitle${i}`).value.trim()}`;
        const detail = $(`dayDetail${i}`).value.trim();
        const body = `${detail}\n\n早餐：${$(`dayBreakfast${i}`).value.trim()}\n午餐：${$(`dayLunch${i}`).value.trim()}\n晚餐：${$(`dayDinner${i}`).value.trim()}\n住宿：${$(`dayHotel${i}`).value.trim()}`;
        const images = [0, 1, 2].map((n) => $(`dayImage${i}_${n}`).value.trim()).filter(Boolean);
        const imageStyles = [0, 1, 2].map((n) => collectImageStyle(`dayImageStyle${i}_${n}`));
        days.push([title, body, images, imageStyles]);
      }
      const flights = [
        collectFlight("去程", "out"),
        collectFlight("回程", "back")
      ];
      return {
        title: $("title").value.trim(),
        region: $("region").value,
        subtitle: $("subtitle").value.trim(),
        image: $("heroImage").value.trim(),
        heroStyle: collectHeroStyle(),
        info: [["天數", `${$("daysCount").value}天`], ["價格", $("price").value.trim()]],
        price: $("price").value.trim(),
        flights,
        highlights: [],
        gallery: days.flatMap((day) => day[2]).filter(Boolean),
        notice: $("notice").value.trim(),
        days
      };
    }

    function collectFlight(type, prefix) {
      return {
        type,
        airline: $(`${prefix}Airline`).value.trim(),
        flightNo: $(`${prefix}FlightNo`).value.trim(),
        date: $(`${prefix}Date`).value.trim(),
        departTime: $(`${prefix}DepartTime`).value.trim(),
        departPlace: $(`${prefix}DepartPlace`).value.trim(),
        arriveTime: $(`${prefix}ArriveTime`).value.trim(),
        arrivePlace: $(`${prefix}ArrivePlace`).value.trim()
      };
    }

    function normalizeDay(day) {
      const title = day[0] || "";
      const body = day[1] || "";
      const images = Array.isArray(day[2]) ? day[2] : day[2] ? [day[2]] : [];
      const imageStyles = Array.isArray(day[3]) ? day[3] : [];
      const mealStart = findMealStart(body);
      const detail = mealStart >= 0 ? body.slice(0, mealStart).trim() : body;
      return {
        title: title.replace(/^Day\s*\d+\s*/i, ""),
        images,
        imageStyles,
        detail,
        breakfast: extractMeal(body, "早餐"),
        lunch: extractMeal(body, "午餐"),
        dinner: extractMeal(body, "晚餐"),
        hotel: extractMeal(body, "住宿")
      };
    }

    function collectImageStyle(prefix) {
      return {
        x: Number($(`${prefix}X`)?.value || 50),
        y: Number($(`${prefix}Y`)?.value || 50),
        zoom: Number($(`${prefix}Zoom`)?.value || 100)
      };
    }

    function fillForm(row) {
      currentId = row.id;
      if ($("tourSelect")) $("tourSelect").value = currentId || "";
      showEditor();
      const payload = row.payload || {};
      $("title").value = payload.title || row.title || "";
      setSelectValue("region", payload.region || getTourRegion(row));
      $("subtitle").value = payload.subtitle || row.subtitle || "";
      $("price").value = payload.price || row.price || "";
      $("heroImage").value = payload.image || row.hero_image || "";
      $("notice").value = payload.notice || "";
      setImageStyle("hero", payload.heroStyle);
      const days = (payload.days || []).map(normalizeDay);
      $("daysCount").value = Math.max(1, days.length || 5);
      renderDayEditors(Number($("daysCount").value), days);
      fillFlights(payload.flights || []);
      updatePreview("heroPreview", $("heroImage").value, "hero");
      $("editorModeHint").textContent = `正在編輯已儲存行程：${row.title || "未命名行程"}`;
      $("saveMessage").textContent = "已載入儲存資料，可以直接編輯修改。";
      markClean();
    }

    function setImageStyle(prefix, style = {}) {
      const normalizedPrefix = prefix === "hero" ? "heroPos" : prefix;
      const values = {
        X: Number(style.x ?? 50),
        Y: Number(style.y ?? 50),
        Zoom: Number(style.zoom ?? 100)
      };
      Object.entries(values).forEach(([suffix, value]) => {
        const id = `${normalizedPrefix}${suffix}`;
        if ($(id)) {
          $(id).value = value;
          syncRangeValue(id);
        }
      });
    }

    function markDirty() {
      hasUnsavedChanges = true;
    }

    function markClean() {
      hasUnsavedChanges = false;
    }

    function confirmLeaveUnsaved() {
      return !hasUnsavedChanges || confirm("資料尚未儲存，確定離開此頁？");
    }

    function watchEditableFields(root = document) {
      root.querySelectorAll("input, textarea, select").forEach((element) => {
        if (element.dataset.dirtyWatcher) return;
        element.dataset.dirtyWatcher = "true";
        element.addEventListener("input", markDirty);
        element.addEventListener("change", markDirty);
      });
    }

    function fillFlights(flights) {
      const out = flights[0] || {};
      const back = flights[1] || {};
      setFlight("out", out);
      setFlight("back", back);
    }

    function setFlight(prefix, flight) {
      setSelectValue(`${prefix}Airline`, flight.airline || "");
      $(`${prefix}FlightNo`).value = flight.flightNo || "";
      $(`${prefix}Date`).value = flight.date || "";
      setAirportValue(`${prefix}DepartPlace`, flight.departPlace || "");
      $(`${prefix}DepartTime`).value = flight.departTime || "";
      setAirportValue(`${prefix}ArrivePlace`, flight.arrivePlace || "");
      $(`${prefix}ArriveTime`).value = flight.arriveTime || "";
    }

    function setSelectValue(id, value) {
      const select = $(id);
      if (!select) return;
      if (value && !Array.from(select.options).some((option) => option.value === value)) {
        select.appendChild(new Option(value, value));
      }
      select.value = value || "";
    }

    function setAirportValue(id, value) {
      const field = $(id);
      if (!field) return;
      if (field.tagName === "SELECT") {
        setSelectValue(id, value);
        return;
      }
      field.value = value || "";
    }

    function findMealStart(body) {
      const indexes = ["早餐：", "午餐：", "晚餐：", "住宿："]
        .map((label) => body.indexOf(label))
        .filter((index) => index >= 0);
      return indexes.length ? Math.min(...indexes) : -1;
    }

    function extractMeal(body, label) {
      const pattern = new RegExp(`${label}：([\\s\\S]*?)(?=\\n(?:早餐|午餐|晚餐|住宿)：|$)`);
      const match = body.match(pattern);
      return match ? match[1].trim() : "";
    }

    function slugify(text) {
      return text.trim().toLowerCase().replace(/\s+/g, "-").replace(/[^\u4e00-\u9fa5a-z0-9-]/g, "").slice(0, 80) || `tour-${Date.now()}`;
    }

    function escapeAttr(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;");
    }

    function escapeText(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;");
    }

    function escapeJs(value) {
      return String(value || "").replaceAll("\\", "\\\\").replaceAll("'", "\\'");
    }
  </script>
</body>
</html>
